name: Daily Morning Briefing

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: daily-briefing
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-generativeai feedparser beautifulsoup4 requests

      # Conserva tu mecanismo original de "ya visto", que sí persiste entre runs.
      - name: Restore history
        run: |
          if [ -f morning_briefing_seen.json ]; then
            cp morning_briefing_seen.json ~/.morning_briefing_seen.json
            echo "Historial restaurado."
          else
            echo "No existe historial previo; se creará al finalizar."
          fi

      - name: Run Morning Briefing
        env:
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GMAIL_FROM:         ${{ secrets.GMAIL_FROM }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO:           ${{ secrets.GMAIL_TO }}
          BANXICO_TOKEN:      ${{ secrets.BANXICO_TOKEN }}
        run: python morning_briefing.py

      - name: Commit and push history update
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f ~/.morning_briefing_seen.json ]; then
            cp ~/.morning_briefing_seen.json morning_briefing_seen.json
          fi

          if [ ! -f morning_briefing_seen.json ]; then
            echo "No se generó archivo de historial."
            exit 0
          fi

          git add morning_briefing_seen.json

          if git diff --staged --quiet; then
            echo "Sin cambios en el historial."
            exit 0
          fi

          git commit -m "chore: update seen news history [skip ci]"

          for i in {1..5}; do
            if git pull --rebase origin main && git push origin main; then
              echo "Historial actualizado correctamente."
              exit 0
            fi
            echo "Colisión detectada con el remoto, reintentando en 5s..."
            sleep 5
          done

          echo "No fue posible actualizar el historial después de 5 intentos."
          exit 1
